name: Idea
description: Something substrate should do, or do differently.
labels: [feat]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task, and what gets in the way today. Start from the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you'd like it to work, as frames or calls where you can.
  - type: textarea
    id: workaround
    attributes:
      label: What you do now
      description: Any workaround you're using.
