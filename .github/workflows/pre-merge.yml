name: Pre-merge

# The heavy Postgres suites, the golden evals included (packages/substrate-dataset-pg/
# test/golden), run here once a PR carries `ready-to-merge` (Decision #627,
# Todo #1859). The label starts a run, and every later push re-runs it.
#
# The suites run once per commit. Each run picks a mode in pg-plan:
#   run     - run the suites (a push, the ready-to-merge label, or no other run to follow)
#   follow  - another label added to a ready PR: wait for the run on this commit that is
#             running the suites, and report its gate result rather than repeating it
#   release - the PR changes only package.json "version" lines and CHANGELOG.md
#             (a release PR): the code is main's, which passed this gate, so nothing runs
#   docs    - the PR changes only Markdown, docs/, the site workflow, or apps/site/src and
#             apps/site/public (renames checked at both ends): no Postgres suite reads them
on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]

permissions: {}

# A push cancels the run for the commit it replaced. A label event runs in a group of its own:
# several labels added at once fire runs on one commit, and a run cancelled while queued has
# no gate job; when it is the commit's newest run, the required gate reads as never reported.
concurrency:
  group: pre-merge-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.run_id || 'push' }}
  cancel-in-progress: true

# onnxruntime-node (via fastembed, dev-only) downloads optional CUDA binaries
# from a GitHub release that no longer exists; the CPU binaries ship on npm.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  # A push to a PR without the label runs nothing heavy, and the gate below
  # says why. Any other label added to a ready PR still gets a gate result, since
  # a skipped or failed gate would be the commit's newest: it follows the run
  # that is testing the commit (mode `follow`) rather than repeating the suites.
  pg-plan:
    name: Postgres passes
    if: contains(github.event.pull_request.labels.*.name, 'ready-to-merge')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      follow: ${{ steps.mode.outputs.follow }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Choose the mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          ADDED: ${{ github.event.label.name }}
          RUN_ID: ${{ github.run_id }}
        run: node .github/scripts/pre-merge-mode.mjs >> "$GITHUB_OUTPUT"

      - name: Plan one pass per package
        id: plan
        if: steps.mode.outputs.mode == 'run'
        run: echo "matrix=$(.github/scripts/test-pg-gated.sh plan)" >> "$GITHUB_OUTPUT"

  # As ci.yml's pg-pass: the role is least-privilege because the test guards
  # refuse a superuser, and the credentials are literals scoped to this
  # throwaway service container.
  pg-pass:
    name: pg ${{ matrix.dir }}
    needs: pg-plan
    if: needs.pg-plan.outputs.mode == 'run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pg-plan.outputs.matrix) }}
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PGPASSWORD: ci-superuser-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter="./${{ matrix.dir }}..."

      - name: Provision the least-privilege test role
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE substrate_test LOGIN PASSWORD 'ci-substrate-test'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE substrate_test OWNER substrate_test;
          SQL
          psql -h 127.0.0.1 -U postgres -d substrate_test -v ON_ERROR_STOP=1 <<'SQL'
          ALTER SCHEMA public OWNER TO substrate_test;
          CREATE EXTENSION IF NOT EXISTS vector;
          SQL

      - name: Test
        env:
          POSTGRES_URL: postgres://substrate_test:ci-substrate-test@127.0.0.1:5432/substrate_test
          PG_REPORTS: ${{ runner.temp }}/pg-reports
        run: .github/scripts/test-pg-gated.sh run "${{ matrix.dir }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: pg-report-${{ strategy.job-index }}
          path: ${{ runner.temp }}/pg-reports
          retention-days: 1

  # The required check. It always runs and never skips, because GitHub counts
  # a skipped job as a passing required check: without the label it fails.
  pre-merge:
    name: Pre-merge Postgres gate
    needs: [pg-plan, pg-pass]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: The PR is labelled ready-to-merge
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'ready-to-merge') }}
        run: |
          echo "::error::add the ready-to-merge label to run the pre-merge Postgres suites"
          exit 1

      - name: The plan succeeded
        if: needs.pg-plan.result != 'success'
        run: |
          echo "::error::the pre-merge plan did not succeed (${{ needs.pg-plan.result }})"
          exit 1

      - name: A release PR reuses main's result
        if: needs.pg-plan.outputs.mode == 'release'
        run: echo "only package.json versions and CHANGELOG.md changed; main passed this gate"

      - name: A docs PR needs no Postgres
        if: needs.pg-plan.outputs.mode == 'docs'
        run: echo "only docs and the site's source and assets changed; no Postgres suite reads them"

      - name: Follow the run that is testing this commit
        if: needs.pg-plan.outputs.mode == 'follow'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FOLLOW: ${{ needs.pg-plan.outputs.follow }}
        run: node .github/scripts/pre-merge-mode.mjs follow

      - name: Every pass succeeded
        if: needs.pg-plan.outputs.mode == 'run' && needs.pg-pass.result != 'success'
        run: |
          echo "::error::a pre-merge pg pass did not succeed (passes: ${{ needs.pg-pass.result }})"
          exit 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: needs.pg-plan.outputs.mode == 'run'
        with:
          pattern: pg-report-*
          path: ${{ runner.temp }}/pg-reports
          merge-multiple: true

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
        if: needs.pg-plan.outputs.mode == 'run'

      # Covers the golden evals: their pg cases skip without POSTGRES_URL like any other.
      - name: Every pg-gated test ran, none skipped
        if: needs.pg-plan.outputs.mode == 'run'
        env:
          PG_REPORTS: ${{ runner.temp }}/pg-reports
        run: .github/scripts/test-pg-gated.sh check
